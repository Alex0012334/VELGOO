<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171c22">
  <title>VELGO | R&D Platform</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #171c22;
      --panel: #20262e;
      --panel-2: #252d36;
      --panel-3: #2b343f;
      --line: #39434e;
      --text: #e8edf2;
      --muted: #98a5b3;
      --blue: #1687d9;
      --blue-hover: #279ae9;
      --green: #42b883;
      --amber: #d7a84c;
      --red: #df6969;
      --radius: 8px;
      font: 14px/1.5 "Segoe UI", Inter, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; cursor: pointer; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .eyebrow { color: #7f91a3; text-transform: uppercase; letter-spacing: .12em; font-size: 10px; font-weight: 700; }
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 12%, #263746 0, #171c22 54%); }
    .login-card { width: min(440px, 100%); padding: 32px; border: 1px solid var(--line); background: rgba(32,38,46,.96); border-radius: 12px; box-shadow: 0 24px 80px #0007; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 14px; font-weight: 750; letter-spacing: .04em; }
    .brand-mark { display: block; width: 136px; height: 40px; flex: 0 0 auto; object-fit: contain; }
    .brand-caption { color: var(--muted); white-space: nowrap; }
    .login-card h1 { margin: 28px 0 5px; font-size: 24px; }
    .login-card > p { margin: 0 0 24px; color: var(--muted); }
    .field { display: grid; gap: 6px; margin-bottom: 14px; }
    label { color: #bdc7d1; font-size: 12px; font-weight: 650; }
    input, select, textarea { width: 100%; color: var(--text); background: #171c22; border: 1px solid var(--line); border-radius: 6px; padding: 10px 11px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px #1687d926; }
    textarea { min-height: 88px; resize: vertical; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-3); padding: 8px 12px; font-weight: 650; transition: .15s ease; }
    .btn:hover { background: #36414d; border-color: #536271; }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: white; }
    .btn-primary:hover { background: var(--blue-hover); border-color: var(--blue-hover); }
    .btn-danger { color: #ffaaaa; }
    .btn-sm { padding: 5px 9px; font-size: 12px; }
    .wide { width: 100%; }
    .login-actions { display: grid; gap: 9px; margin-top: 20px; }
    .demo-note { margin-top: 18px; padding: 10px 12px; border: 1px solid #3c5264; border-radius: 6px; background: #1b2a36; color: #a9bfce; font-size: 11px; }
    .cloud-connection { margin-top: 12px; color: #9eb4c5; font-size: 11px; }
    .cloud-connection.error { color: #ffaaaa; }
    .cloud-connection button { margin-left: 6px; padding: 0; border: 0; color: #78bff2; background: none; text-decoration: underline; }
    .app-shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: #1b2027; padding: 18px 12px; }
    .sidebar .brand { padding: 2px 9px 22px; }
    .sidebar .brand-mark { width: 100px; height: 34px; }
    .nav-label { padding: 12px 10px 7px; color: #71808e; text-transform: uppercase; letter-spacing: .11em; font-size: 10px; font-weight: 700; }
    .nav-btn { width: 100%; display: flex; align-items: center; gap: 11px; padding: 10px; margin: 2px 0; color: #aeb9c4; text-align: left; background: transparent; border: 0; border-radius: 6px; }
    .nav-btn:hover { background: #252d36; color: var(--text); }
    .nav-btn.active { color: white; background: #123d5c; box-shadow: inset 2px 0 var(--blue); }
    .nav-icon { width: 18px; text-align: center; color: #93a3b2; }
    .nav-unread-badge { display: inline-flex; min-width: 18px; height: 18px; align-items: center; justify-content: center; margin-left: auto; padding: 0 5px; border-radius: 99px; color: #fff; background: #d94343; font-size: 10px; font-weight: 750; line-height: 1; }
    .sidebar-bottom { margin-top: auto; border-top: 1px solid #303943; padding: 14px 8px 0; }
    .user-chip { display: flex; align-items: center; gap: 9px; padding: 6px 2px 13px; }
    .avatar { display: grid; place-items: center; width: 32px; height: 32px; flex: 0 0 auto; border-radius: 50%; color: #d9efff; background: #24577a; font-size: 12px; font-weight: 750; }
    .user-chip strong { display: block; font-size: 12px; }
    .user-chip small { display: block; color: var(--muted); font-size: 10px; }
    .main { min-width: 0; }
    .topbar { height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 28px; border-bottom: 1px solid var(--line); background: #1c2229; }
    .topbar-title { font-weight: 680; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .local-badge { border: 1px solid #40515f; border-radius: 20px; padding: 4px 9px; color: #9eb4c5; font-size: 10px; }
    .local-badge button { margin-left: 4px; padding: 0; border: 0; color: #ffd1d1; background: none; font-size: inherit; text-decoration: underline; }
    .content { max-width: 1440px; margin: 0 auto; padding: 28px; }
    .page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .page-heading h1 { margin: 3px 0 4px; font-size: 24px; letter-spacing: -.025em; }
    .page-heading p { margin: 0; color: var(--muted); }
    .heading-actions { display: flex; gap: 8px; }
    .grid { display: grid; gap: 16px; }
    .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 18px; }
    .card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
    .stat-card { padding: 16px; }
    .stat-label { color: var(--muted); font-size: 12px; }
    .stat-value { margin-top: 5px; font-size: 26px; font-weight: 730; letter-spacing: -.03em; }
    .stat-foot { margin-top: 2px; color: #82909d; font-size: 11px; }
    .two-col { grid-template-columns: minmax(0, 1.4fr) minmax(250px, .8fr); }
    .card-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 15px 17px; border-bottom: 1px solid var(--line); }
    .card-header h2, .card-header h3 { margin: 0; font-size: 14px; }
    .card-body { padding: 16px 17px; }
    .task-list { display: grid; }
    .task-row { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 12px; padding: 13px 17px; border-bottom: 1px solid #303943; }
    .task-row:last-child { border-bottom: 0; }
    .task-title { font-weight: 650; }
    .task-title-line { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .new-task-badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 99px; color: #fff; background: #b93636; font-size: 9px; font-weight: 750; line-height: 1.4; white-space: nowrap; }
    .task-meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .schedule-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .schedule-week-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .schedule-week-label { min-width: 190px; text-align: center; font-weight: 650; }
    .schedule-legend { display: flex; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 11px; }
    .schedule-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .schedule-dot { width: 10px; height: 10px; border-radius: 3px; }
    .schedule-dot.office { background: #42b883; }
    .schedule-dot.online { background: #1687d9; }
    .schedule-dot.unavailable { background: #69737d; }
    .schedule-person-card { overflow: hidden; margin-bottom: 14px; }
    .schedule-person-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
    .schedule-person-name { font-weight: 700; }
    .schedule-own-label { margin-left: 6px; color: #7ebdec; font-size: 11px; font-weight: 500; }
    .schedule-table-wrap { overflow: auto; max-height: 640px; }
    .schedule-table { min-width: 800px; border-spacing: 0; }
    .schedule-table th { position: sticky; top: 0; z-index: 2; text-align: center; }
    .schedule-table th:first-child { left: 0; z-index: 3; min-width: 86px; text-align: left; }
    .schedule-table td { min-width: 96px; padding: 5px; text-align: center; background: var(--panel); }
    .schedule-table td:first-child { position: sticky; left: 0; z-index: 1; min-width: 86px; color: var(--muted); background: #1c2229; text-align: left; font-size: 11px; white-space: nowrap; }
    .availability-cell { width: 100%; min-height: 30px; padding: 4px; border: 1px solid #48525d; border-radius: 5px; color: #bec7cf; background: #252d36; font-size: 10px; }
    .availability-cell:disabled { opacity: 1; cursor: default; }
    .availability-cell.office { border-color: #316a50; color: #a7e4c4; background: #18553844; }
    .availability-cell.online { border-color: #315a78; color: #a1d4fa; background: #16466b44; }
    .availability-cell.unavailable { border-color: #48525d; color: #bec7cf; background: #303943; }
    .schedule-note { margin: 0 0 14px; }
    .status { display: inline-flex; align-items: center; border: 1px solid; border-radius: 99px; padding: 3px 8px; font-size: 10px; white-space: nowrap; }
    .status.todo { color: #c5a96e; border-color: #6b5936; background: #51412440; }
    .status.progress { color: #73b9ed; border-color: #315a78; background: #16466b44; }
    .status.done { color: #71d2a3; border-color: #316a50; background: #18553844; }
    .profile-layout { grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); align-items: start; }
    .profile-hero { padding: 22px; }
    .profile-person { display: flex; align-items: center; gap: 15px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
    .profile-person .avatar { width: 54px; height: 54px; font-size: 17px; }
    .profile-person h2 { margin: 0; font-size: 19px; }
    .profile-person p { margin: 2px 0 0; color: var(--muted); }
    .detail-list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
    .detail-label { color: var(--muted); font-size: 11px; }
    .detail-value { margin-top: 3px; font-weight: 600; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 11px 14px; color: #8d9ba8; background: #1c2229; text-transform: uppercase; letter-spacing: .06em; font-size: 10px; }
    td { padding: 12px 14px; border-top: 1px solid #303943; vertical-align: middle; }
    tr:hover td { background: #252d36; }
    .table-main { font-weight: 650; overflow-wrap: anywhere; word-break: break-word; }
    .table-sub { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; word-break: break-word; }
    .task-description-preview { display: block; width: 100%; max-width: 620px; min-width: 0; margin: 3px 0 0; padding: 0; border: 0; color: var(--muted); background: transparent; text-align: left; font-size: 11px; cursor: pointer; overflow-wrap: anywhere; word-break: break-word; }
    .task-description-preview:hover { color: #d3e6f4; }
    .task-description-preview span { color: #70baf0; white-space: nowrap; }
    .task-description-full { color: #d4dce4; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .filter-row input, .filter-row select { width: auto; min-width: 180px; padding: 8px 10px; }
    .empty { padding: 30px 16px; text-align: center; color: var(--muted); }
    .empty strong { display: block; margin-bottom: 5px; color: #c1cbd4; }
    .file-layout { grid-template-columns: minmax(0,1fr) 300px; align-items: start; }
    .file-main { min-width: 0; }
    .file-list { position: sticky; top: 14px; overflow: hidden; }
    .file-list-items { display: grid; max-height: 620px; overflow: auto; }
    .file-list-item { display: block; width: 100%; padding: 12px 14px; border: 0; border-bottom: 1px solid #303943; color: var(--text); background: transparent; text-align: left; cursor: pointer; }
    .file-list-item:last-child { border-bottom: 0; }
    .file-list-item:hover, .file-list-item.active { background: #2a333d; }
    .file-list-item.active { box-shadow: inset 2px 0 var(--blue); }
    .file-list-name { display: block; font-size: 12px; font-weight: 650; overflow-wrap: anywhere; }
    .file-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 5px 10px; margin-top: 6px; color: var(--muted); font-size: 10px; }
    .file-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .viewer-stage { position: relative; display: flex; min-height: 420px; max-height: 70vh; justify-content: center; align-items: center; overflow: auto; border: 1px solid #c9cdd1; border-radius: 7px; color: #4a4f54; background: #fff; }
    .viewer-stage.viewer-stage-3d { height: min(70vh,560px); min-height: 360px; overflow: hidden; }
    .viewer-stage.pdf-viewer { display: flex; height: min(70vh,800px); min-height: 420px; max-height: none; flex-direction: column; justify-content: flex-start; align-items: stretch; overflow: hidden; background: #e7eaed; }
    .pdf-toolbar { display: flex; flex: 0 0 auto; align-items: center; justify-content: center; gap: 8px; padding: 8px; border-bottom: 1px solid #c9cdd1; background: #f7f8f9; }
    .pdf-toolbar button { min-width: 34px; padding: 5px 8px; border: 1px solid #c9cdd1; border-radius: 5px; color: #30363b; background: #fff; }
    .pdf-toolbar button:disabled { opacity: .45; cursor: default; }
    .pdf-page-label { min-width: 90px; color: #454b51; text-align: center; font-size: 12px; }
    .pdf-page-container { display: flex; flex: 1; min-height: 0; justify-content: center; align-items: flex-start; overflow: auto; padding: 14px; }
    .pdf-page-container canvas { display: block; max-width: none; height: auto; background: #fff; box-shadow: 0 2px 8px #0003; }
    .pdf-loading { margin: auto; padding: 20px; color: #525960; text-align: center; }
    .viewer-stage img { display: block; max-width: 100%; max-height: 68vh; object-fit: contain; }
    .viewer-stage iframe { display: block; width: 100%; height: 68vh; min-height: 420px; border: 0; background: #fff; }
    .viewer-stage pre { width: 100%; align-self: stretch; margin: 0; padding: 20px; overflow: auto; color: #30363b; background: #fff; font: 12px/1.55 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .viewer-stage canvas { display: block; width: 100%; height: 100%; min-height: 420px; cursor: grab; touch-action: none; }
    .viewer-stage-3d canvas { flex: 1; min-height: 0; }
    .viewer-stage canvas:active { cursor: grabbing; }
    .viewer-format-note { position: absolute; right: 9px; bottom: 8px; max-width: calc(100% - 18px); padding: 3px 7px; border-radius: 4px; color: #606870; background: #ffffffd9; font-size: 10px; pointer-events: none; }
    .viewer-message { padding: 28px; color: #606870; text-align: center; }
    .viewer-message strong { display: block; margin-bottom: 6px; color: #343a40; }
    .viewer-message p { margin: 0; }
    .file-info { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .file-comments { margin-top: 14px; }
    .file-list-empty { padding: 20px 14px; color: var(--muted); text-align: center; font-size: 12px; }
    .comment-list { display: grid; gap: 10px; margin-top: 14px; }
    .comment { padding: 10px; border-radius: 6px; background: #1a2027; }
    .comment-head { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; }
    .comment time { color: #82909d; }
    .comment p { margin: 5px 0 0; color: #c2cbd3; white-space: pre-wrap; overflow-wrap: anywhere; }
    .admin-grid { grid-template-columns: minmax(0,1.2fr) minmax(280px,.8fr); align-items: start; }
    .settings-form { max-width: 620px; }
    .notice { padding: 11px 13px; border: 1px solid #655634; border-radius: 6px; color: #d8c28d; background: #3b321f55; font-size: 11px; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: #080b0fbb; }
    .modal { width: min(600px, 100%); max-height: min(92vh, 850px); overflow-y: auto; border: 1px solid #48545f; border-radius: 9px; background: var(--panel); box-shadow: 0 24px 80px #0009; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 15px 18px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-size: 16px; }
    .modal-body { padding: 18px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 13px 18px; border-top: 1px solid var(--line); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .form-grid .full { grid-column: 1/-1; }
    .toast { position: fixed; right: 22px; bottom: 20px; z-index: 50; max-width: min(420px, calc(100vw - 40px)); padding: 12px 16px; border: 1px solid #4b5b69; border-radius: 7px; background: #263440; box-shadow: 0 12px 35px #0008; }
    .toast.error { border-color: #8f4d4d; background: #422b2b; }
    .link { color: #6db8ee; text-decoration: none; }
    .link:hover { text-decoration: underline; }
    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 190px minmax(0,1fr); }
      .content { padding: 22px 18px; }
      .stats { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .two-col, .profile-layout, .file-layout, .admin-grid { grid-template-columns: minmax(0,1fr); }
      .file-list { position: static; }
      .file-list-items { max-height: 260px; }
    }
    @media (max-width: 620px) {
      .app-shell { display: block; }
      .sidebar { position: sticky; top: 0; z-index: 5; flex-direction: row; align-items: center; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); scrollbar-width: none; }
      .sidebar::-webkit-scrollbar { display: none; }
      .sidebar .brand { padding: 0 4px; flex: 0 0 auto; }
      .sidebar .brand-mark { width: 76px; height: 28px; }
      .brand-caption, .nav-label, .sidebar-bottom { display: none; }
      #main-nav { display: flex; flex: 0 0 auto; }
      .nav-btn { width: auto; min-width: 42px; justify-content: center; padding: 9px; }
      .nav-btn .nav-text { display: none; }
      .topbar { height: 50px; padding: 0 14px; }
      .content { padding: 18px 12px; }
      .page-heading { align-items: flex-start; flex-wrap: wrap; }
      .page-heading h1 { font-size: 21px; }
      .heading-actions { flex-wrap: wrap; }
      .local-badge { display: none; }
      .local-badge.error { display: inline-flex; align-items: center; border-color: #6a3b3b; color: #ffaaaa; }
      .task-row { padding: 12px; }
      .stats { gap: 10px; }
      .stat-card { padding: 13px; }
      .stat-value { font-size: 22px; }
      .form-grid { grid-template-columns: minmax(0,1fr); }
      .form-grid .full { grid-column: auto; }
      .file-layout { grid-template-columns: minmax(0,1fr); }
      .viewer-stage { min-height: 300px; }
      .viewer-stage.viewer-stage-3d { height: min(60vh,420px); min-height: 280px; }
      .viewer-stage iframe, .viewer-stage canvas { min-height: 300px; }
      .viewer-stage-3d canvas { min-height: 0; }
      .login-wrap { padding: 16px; }
      .login-card { padding: 24px 20px; }
      .login-card .brand-mark { width: 136px; height: 36px; }
      .login-card .brand-caption { font-size: 11px; }
      .detail-list { grid-template-columns: minmax(0,1fr); }
      .modal-backdrop { padding: 10px; }
      .modal-body { padding: 14px; }
    }
  </style>
</head>
<body>
  <section id="login-screen" class="login-wrap">
    <div class="login-card">
      <div class="brand"><img class="brand-mark" src="logo-transparent.png" alt="VELGO"><span class="brand-caption">/ R&amp;D PLATFORM</span></div>
      <h1>Workspace</h1>
      <p>Sign in to the VELGO team platform.</p>
      <div class="login-actions">
        <form id="employee-auth-form">
          <div class="field">
            <label for="login-user">Employee username or admin password</label>
            <input id="login-user" type="text" autocomplete="username" placeholder="Enter username" required>
          </div>
          <button id="user-login" type="submit" class="btn btn-primary wide" disabled>Sign in</button>
        </form>
      </div>
      <div id="login-cloud-status" class="cloud-connection" role="status" aria-live="polite">Connecting to Google Drive…</div>
      <div class="demo-note">Sign-in is not server-side security. Anyone with the Apps Script deployment URL may access its Drive data. Do not store confidential information.</div>
    </div>
  </section>

  <div id="app-screen" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand"><img class="brand-mark" src="logo-transparent.png" alt="VELGO"><span class="brand-caption">R&amp;D</span></div>
      <nav id="main-nav"></nav>
      <div class="sidebar-bottom">
        <div class="user-chip"><div id="sidebar-avatar" class="avatar">V</div><div><strong id="sidebar-name"></strong><small id="sidebar-role"></small></div></div>
        <button id="logout" class="btn btn-sm wide">Sign out</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar"><div id="topbar-title" class="topbar-title">Overview</div><div class="topbar-right"><span id="app-cloud-status" class="local-badge">● GOOGLE DRIVE</span><button id="mobile-logout" class="btn btn-sm">Sign out</button></div></header>
      <div id="content" class="content"></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

      let state = loadState();

      function setCloudStatus(message, error = false, retry = false) {
        const status = `${escapeHtml(message)}${retry ? ` <button type="button" data-cloud-retry>Retry</button>` : ""}`;
        const loginStatus = $("#login-cloud-status");

          appStatus.classList.toggle("error", error);

      }
      function loadRemoteJsonp(action, params = {}) {
        return new Promise((resolve, reject) => {
          const callbackName = `__velgoCallback_${id().replace(/-/g, "")}`;
          const script = document.createElement("script");
          const query = new URLSearchParams({ action, callback: callbackName, ...params, _ts: String(Date.now()) });
          const cleanup = () => {
            delete window[callbackName];
            script.remove();
            clearTimeout(timer);
          };
          const timer = setTimeout(() => { cleanup(); reject(new Error("Google Drive did not respond in time.")); }, 45000);
          window[callbackName] = value => { cleanup(); resolve(value); };
          script.onerror = () => { cleanup(); reject(new Error("Could not reach the Google Drive service.")); };
          script.src = `${DRIVE_API_URL}?${query}`;
          document.head.append(script);
        });
      }
      function postCloudAction(action) {
        return new Promise((resolve, reject) => {
          const requestId = id();
          const iframe = document.createElement("iframe");
          const form = document.createElement("form");
          const frameName = `velgo-cloud-${requestId.replace(/-/g, "")}`;
          iframe.name = frameName;
          iframe.className = "hidden";
          iframe.setAttribute("aria-hidden", "true");
          form.method = "POST";
          form.action = DRIVE_API_URL;
          form.target = frameName;
          form.className = "hidden";
          const payload = { ...action, requestId };
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = "payload";
          input.value = JSON.stringify(payload);
          form.append(input);
          let settled = false;
          const cleanup = () => {
            window.removeEventListener("message", onMessage);
            clearTimeout(timer);
            iframe.remove();
            form.remove();
          };
          const finish = (error, value) => {
            if (settled) return;
            settled = true;
            cleanup();
            error ? reject(error) : resolve(value);
          };
          const onMessage = event => {
            if (event.data?.requestId !== requestId) return;

          document.body.append(iframe, form);
          form.submit();
        });
      }
      function stateForCloud() {
        const cloudState = { ...state };
        delete cloudState.adminPassword;
        return cloudState;
      }
      function cloneState(value) {
        return value == null ? value : JSON.parse(JSON.stringify(value));
      }
      function mergeConcurrentState(base, local, remote) {
        const same = (left, right) => JSON.stringify(left) === JSON.stringify(right);
        if (same(local, base)) return cloneState(remote);
        if (same(remote, base) || same(local, remote)) return cloneState(local);
        const isRecord = value => value !== null && typeof value === "object" && !Array.isArray(value);
        if (Array.isArray(base) && Array.isArray(local) && Array.isArray(remote) &&
            [...base, ...local, ...remote].every(item => item && isRecord(item) && item.id)) {
          const byId = items => new Map(items.map(item => [String(item.id), item]));
          const baseById = byId(base);
          const localById = byId(local);
          const remoteById = byId(remote);
          const ids = [...new Set([...localById.keys(), ...remoteById.keys()])];
          return ids.flatMap(itemId => {
            const inBase = baseById.has(itemId);
            const inLocal = localById.has(itemId);
            const inRemote = remoteById.has(itemId);
            if (!inLocal && !inRemote) return [];
            if (inBase && !inLocal) return same(remoteById.get(itemId), baseById.get(itemId)) ? [] : [remoteById.get(itemId)];
            if (inBase && !inRemote) return same(localById.get(itemId), baseById.get(itemId)) ? [] : [localById.get(itemId)];
            if (inLocal && inRemote) {
              return [inBase
                ? mergeConcurrentState(baseById.get(itemId), localById.get(itemId), remoteById.get(itemId))
                : mergeConcurrentState({}, localById.get(itemId), remoteById.get(itemId))];
            }
            return [inLocal ? localById.get(itemId) : remoteById.get(itemId)];
          });
        }
        if (Array.isArray(base) && Array.isArray(local) && Array.isArray(remote)) {
          const isAppendOnly = items => base.every((item, index) => same(item, items[index]));
          if (isAppendOnly(local) && isAppendOnly(remote)) {
            const merged = cloneState(base);
            [...local.slice(base.length), ...remote.slice(base.length)].forEach(item => {
              if (!merged.some(existing => same(existing, item))) merged.push(cloneState(item));
            });
            return merged;
          }
        }
        if (isRecord(base) && isRecord(local) && isRecord(remote)) {
          const result = {};
          const keys = new Set([...Object.keys(base), ...Object.keys(local), ...Object.keys(remote)]);
          keys.forEach(key => {
            const hasBase = Object.prototype.hasOwnProperty.call(base, key);
            const hasLocal = Object.prototype.hasOwnProperty.call(local, key);
            const hasRemote = Object.prototype.hasOwnProperty.call(remote, key);
            const value = mergeConcurrentState(
              hasBase ? base[key] : undefined,
              hasLocal ? local[key] : undefined,
              hasRemote ? remote[key] : undefined
            );
            if (value !== undefined) result[key] = value;
          });
          return result;
        }
        return cloneState(local);
      }
      function applyCloudState(remoteState) {
        if (!remoteState || !Array.isArray(remoteState.users) || !Array.isArray(remoteState.tasks) || !Array.isArray(remoteState.files)) {
          throw new Error("The shared Drive data is invalid; it was not loaded.");

        const localAdminPassword = state.adminPassword;
        state = { ...initialState(), ...cloneState(remoteState), adminPassword: localAdminPassword };
        if (!state.availability || typeof state.availability !== "object" || Array.isArray(state.availability)) state.availability = {};

        if (session && !session.isAdmin) {
          const refreshedUser = state.users.find(user => user.id === session.id);
          if (refreshedUser) session = { ...refreshedUser, isAdmin: false };

        catch (error) { console.warn("Could not cache shared platform data in this browser.", error); }

      }
      function applyCloudSaveResult(result, submittedState) {
        if (!result?.state || !Array.isArray(result.state.users) || !Array.isArray(result.state.tasks) || !Array.isArray(result.state.files)) {
          throw new Error("Google Drive returned an invalid saved state.");
        }
        const localAdminPassword = state.adminPassword;
        const currentLocalState = stateForCloud();
        const rebasedState = mergeConcurrentState(submittedState, currentLocalState, result.state);
        state = { ...initialState(), ...rebasedState, adminPassword: localAdminPassword };
        cloudBaseState = cloneState(result.state);
        if (session && !session.isAdmin) {
          const refreshedUser = state.users.find(user => user.id === session.id);
          if (refreshedUser) session = { ...refreshedUser, isAdmin: false };
        }
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
        catch (error) { console.warn("Could not cache shared platform data in this browser.", error); }
        refreshActivePage();
      }
      function setCloudSaveStatus(promise) {

          cloudLastError = null;
          cloudSavePending = Math.max(0, cloudSavePending - 1);
          setCloudStatus("Drive synced");
          return result;
        }).catch(error => {
          cloudSavePending = Math.max(0, cloudSavePending - 1);
          cloudLastError = error;
          console.error("Could not synchronize platform data with Google Drive.", error);
          setCloudStatus(error.message || "Drive sync failed", true, true);
        });
        return cloudSaveQueue;
      }
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          if (cloudReady) {
            const snapshot = stateForCloud();
            const baseSnapshot = cloneState(cloudBaseState || snapshot);
            setCloudSaveStatus(async () => {
              const result = await postCloudAction({ action: "saveState", state: snapshot, baseState: baseSnapshot });
              applyCloudSaveResult(result, snapshot);
              return result;
            });

          notify("Browser storage is full or unavailable. Reduce the amount of data and try again.", true);
          return false;
        }
      }
      async function blobToBase64(blob) {
        const bytes = new Uint8Array(await blob.arrayBuffer());
        let binary = "";
        for (let offset = 0; offset < bytes.length; offset += 0x8000) {
          binary += String.fromCharCode(...bytes.subarray(offset, offset + 0x8000));
        }
        return btoa(binary);
      }
      async function initializeCloud() {
        const loginButton = $("#user-login");
        if (loginButton) loginButton.disabled = true;
        setCloudStatus("Connecting to Drive");
        try {
          if (cloudReady) {
            await cloudSaveQueue;
            const snapshot = stateForCloud();
            const result = await postCloudAction({ action: "saveState", state: snapshot, baseState: cloneState(cloudBaseState || snapshot) });
            applyCloudSaveResult(result, snapshot);
            cloudLastError = null;
            setCloudStatus("Drive synced");
            startCloudPolling();
            if (loginButton) loginButton.disabled = false;
            return;
          }
          const envelope = await loadRemoteJsonp("load");
          if (envelope !== null) {
            applyCloudState(envelope.state);
          }
          const migratedFiles = await uploadExistingLocalFiles();
          cloudReady = true;
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
          catch (error) { console.warn("Could not cache shared platform data in this browser.", error); }
          if (envelope === null || migratedFiles) {
            const snapshot = stateForCloud();
            const result = await postCloudAction({ action: "saveState", state: snapshot, baseState: cloneState(cloudBaseState || snapshot) });
            applyCloudSaveResult(result, snapshot);
          }
          setCloudStatus("Drive connected");
          startCloudPolling();
          if (loginButton) loginButton.disabled = false;
        } catch (error) {
          cloudReady = false;
          cloudLastError = error;
          console.error("Could not initialize Google Drive storage.", error);

      function startCloudPolling() {
        if (!cloudReady || !session || cloudPollTimer) return;
        cloudPollTimer = setInterval(syncRemoteState, 15000);

      function stopCloudPolling() {
        if (cloudPollTimer) clearInterval(cloudPollTimer);
        cloudPollTimer = null;

      async function syncRemoteState() {
        const activeElement = document.activeElement;
        if (!cloudReady || !session || document.visibilityState !== "visible" || cloudSavePending || cloudPollInFlight ||

            activeElement?.matches("input, textarea, select")) return;
        cloudPollInFlight = true;
        try {
          const envelope = await loadRemoteJsonp("load");
          if (!envelope?.state || !session || cloudSavePending || $("#modal-root").childElementCount ||
              document.visibilityState !== "visible" || document.activeElement?.matches("input, textarea, select")) return;
          if (JSON.stringify(envelope.state) === JSON.stringify(cloudBaseState)) return;
          applyCloudState(envelope.state);
        } catch (error) {
          console.warn("Could not refresh shared platform data from Google Drive.", error);
        } finally {
          cloudPollInFlight = false;

      document.addEventListener("visibilitychange", () => {

      window.addEventListener("focus", syncRemoteState);
      async function uploadExistingLocalFiles() {
        let changed = false;
        const records = [
          ...state.files,
          ...state.tasks.flatMap(task => Array.isArray(task.attachments) ? task.attachments : [])
        ];
        const seen = new Set();
        for (const record of records) {
          if (!record?.id || record.driveFileId || seen.has(record.id)) continue;
          seen.add(record.id);
          let blob;
          try { blob = await getLocalStoredFileBlob(record.id); }
          catch (error) {
            console.warn(`Could not read local file ${record.id} for Drive migration.`, error);
            continue;
          }
          if (!blob) continue;
          const result = await postCloudAction({
            action: "uploadFile",
            name: record.name || "attachment",
            mimeType: blob.type || record.type || "application/octet-stream",
            base64: await blobToBase64(blob)

          changed = true;

      }
      function getDriveFileId(localFileId) {
        const file = state.files.find(item => item.id === localFileId);
        if (file?.driveFileId) return file.driveFileId;
        for (const task of state.tasks) {
          const attachment = task.attachments?.find(item => item.id === localFileId);
          if (attachment?.driveFileId) return attachment.driveFileId;
        }
        return null;
      }
      async function getLocalStoredFileBlob(fileId) {
        const db = await openTaskFileDb();
        return new Promise((resolve, reject) => {
          const transaction = db.transaction("attachments", "readonly");
          const request = transaction.objectStore("attachments").get(fileId);
          request.onsuccess = () => resolve(request.result?.blob || null);
          request.onerror = () => reject(request.error || new Error("Could not read the file."));
          transaction.oncomplete = () => db.close();
          transaction.onerror = () => { db.close(); reject(transaction.error || new Error("Could not read the file.")); };
        });
      }
      function openTaskFileDb() {
        if (!("indexedDB" in window)) return Promise.reject(new Error("IndexedDB is unavailable in this browser."));
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(TASK_FILE_DB_NAME, 1);
          request.onupgradeneeded = () => {
            if (!request.result.objectStoreNames.contains("attachments")) request.result.createObjectStore("attachments", { keyPath: "id" });
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error("Could not open file storage."));
          request.onblocked = () => reject(new Error("File storage is in use by another tab. Close other app tabs and try again."));
        });
      }
      async function storeTaskAttachments(files) {
        if (!files.length) return;
        const uploaded = [];
        try {
          for (const item of files) {
            if (item.file.size > 20 * 1024 * 1024) throw new Error("Files larger than 20 MB are not supported.");
            const result = await postCloudAction({
              action: "uploadFile",
              name: item.file.name,
              mimeType: item.file.type || "application/octet-stream",
              base64: await blobToBase64(item.file)
            });
            item.driveFileId = result.id;
            if (item.metadata) item.metadata.driveFileId = result.id;
            uploaded.push(result.id);
          }
        } catch (error) {
          await Promise.all(uploaded.map(fileId => postCloudAction({ action: "deleteFile", fileId }).catch(cleanupError => console.error("Could not clean up an incomplete Drive upload.", cleanupError))));
          throw error;
        }
        try {
          const db = await openTaskFileDb();
          await new Promise((resolve, reject) => {
            const transaction = db.transaction("attachments", "readwrite");
            const store = transaction.objectStore("attachments");
            files.forEach(item => store.put({ id: item.id, blob: item.file }));
            transaction.oncomplete = () => resolve();
            transaction.onerror = () => reject(transaction.error || new Error("Could not save local file cache."));
            transaction.onabort = () => reject(transaction.error || new Error("Saving local file cache was cancelled."));

        }

      async function deleteTaskAttachments(ids) {
        if (!ids.length) return;
        const db = await openTaskFileDb();
        return new Promise((resolve, reject) => {
          const transaction = db.transaction("attachments", "readwrite");
          const store = transaction.objectStore("attachments");
          ids.forEach(fileId => store.delete(fileId));
          transaction.oncomplete = () => { db.close(); resolve(); };
          transaction.onerror = () => { db.close(); reject(transaction.error || new Error("Could not delete attachments.")); };
          transaction.onabort = () => { db.close(); reject(transaction.error || new Error("Deleting files was cancelled.")); };
        });
      }
      async function downloadTaskAttachment(fileId, fileName) {
        const blob = await getStoredFileBlob(fileId);
        if (!blob) throw new Error("File contents are not available in Google Drive.");
        const objectUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = objectUrl;
        link.download = fileName;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
      }
      async function getStoredFileBlob(fileId) {
        try {
          const localBlob = await getLocalStoredFileBlob(fileId);
          if (localBlob) return localBlob;
        } catch (error) {
          console.warn("Local file cache unavailable; trying Google Drive.", error);
        }
        const driveFileId = getDriveFileId(fileId);
        if (!driveFileId) return null;
        const response = await loadRemoteJsonp("file", { fileId: driveFileId });
        if (!response?.base64) throw new Error("Google Drive returned no file content.");
        const binary = atob(response.base64);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
        const blob = new Blob([bytes], { type: response.mimeType || "application/octet-stream" });
        try {
          const db = await openTaskFileDb();
          await new Promise((resolve, reject) => {
            const transaction = db.transaction("attachments", "readwrite");
            transaction.objectStore("attachments").put({ id: fileId, blob });
            transaction.oncomplete = resolve;
            transaction.onerror = () => reject(transaction.error || new Error("Could not cache downloaded file."));
            transaction.onabort = () => reject(transaction.error || new Error("Could not cache downloaded file."));
          });
          db.close();
        } catch (error) {
          console.warn("Could not cache downloaded Drive file.", error);
        }
        return blob;
      }
      function notify(message, error = false) {

      const userById = userId => state.users.find(user => user.id === userId);

        const scrollPositions = scrollSelectors.flatMap(selector =>
          Array.from(content.querySelectorAll(selector), (element, index) => ({
            selector, index, top: element.scrollTop, left: element.scrollLeft
          }))
        );
        const drafts = new Map(["task-search", "task-filter", "comment-text", "drive-url"]
          .map(fieldId => [fieldId, document.getElementById(fieldId)])

              target || (focused?.hasAttribute(attribute)

      function renderApp(options = {}) {

      function renderTasks() {

        }).join("");
        $("#content").innerHTML = `${pageHeading("Planning", "Plan and Tasks", canManage() ? "Create tasks and track team progress." : "Tasks assigned to your profile and department.", canManage() ? '<button class="btn btn-primary" data-action="new-task">＋ New Task</button>' : "")}
          <section class="card"><div class="filter-row"><input id="task-search" type="search" placeholder="Search by ID or title…"><select id="task-filter"><option value="">All statuses</option>${STATUSES.map(status => `<option>${status}</option>`).join("")}</select></div>
          <div class="table-wrap"><table><thead><tr><th>ID</th><th>Task</th><th>Assignee</th><th>Deadline</th><th>Status</th><th>${canManage() ? "Change Status" : "Action"}</th></tr></thead><tbody id="tasks-body">${rows || `<tr><td colspan="6">${empty("No tasks found", canManage() ? "Create the first task." : "Contact your manager to get assigned tasks.")}</td></tr>`}</tbody></table></div></section>`;
        $("#task-search").addEventListener("input", filterTasks);

      function filterTasks() {

      }
      function scheduleDateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;

      function getScheduleWeek(offset) {
        const monday = new Date();
        monday.setHours(0,0,0,0);

        return Array.from({ length: 7 }, (_,index) => {
          const date = new Date(monday);
          date.setDate(monday.getDate()+index);
          return date;
        });
      }
      function renderSchedule() {
        const dates = getScheduleWeek(scheduleWeekOffset);

          ${isAdmin() ? `<div class="notice schedule-note">The System Admin can view the schedule but cannot edit employee availability.</div>` : `<div class="muted schedule-note">Click cells in your schedule to cycle through availability options. An empty cell means no availability has been set. Hourly slots: 07:00–08:00 … 23:00–24:00.</div>`}
          <div class="notice schedule-note">Availability and schedule updates are shared with the team through Google Drive.</div>
          ${people || empty("No employees yet","The schedule will appear after employee profiles are added.")}`;
        $("#content").querySelectorAll("[data-week-shift]").forEach(button => button.addEventListener("click", () => {

      function updateTaskStatus(taskId, status) {

      function loadPdfJs() {

              ? resolve(window.pdfjsLib)
              : reject(new Error("PDF.js loaded, but the library is unavailable."));
            script.onerror = () => {

              reject(new Error("Could not load the PDF viewer. Check your internet connection."));

            document.head.append(script);

        return pdfJsPromise;
      }
      async function renderPdfFile(blob, preview, generation) {

        preview.innerHTML = `<div class="pdf-toolbar"><button type="button" data-pdf-prev aria-label="Previous page">←</button><span class="pdf-page-label" data-pdf-page>Loading…</span><button type="button" data-pdf-next aria-label="Next page">→</button><button type="button" data-pdf-zoom-out aria-label="Zoom out">−</button><button type="button" data-pdf-zoom-in aria-label="Zoom in">＋</button></div><div class="pdf-page-container"><div class="pdf-loading">Opening PDF locally in your browser…</div></div>`;

        const userRows = state.users.map(user => `<tr><td><div class="table-main">${escapeHtml(displayName(user))}</div></td><td><code>${escapeHtml(user.username)}</code></td><td>${escapeHtml(user.department)}</td><td>${fmtDate(user.birthDate)}</td><td><button class="btn btn-sm" data-edit-user="${escapeHtml(user.id)}">Edit</button> <button class="btn btn-sm btn-danger" data-delete-user="${escapeHtml(user.id)}">Delete</button></td></tr>`).join("");
        $("#content").innerHTML = `${pageHeading("Platform Management", "Employees and Google Drive", "Add employees, assign usernames, and configure the shared Drive link.", '<button class="btn btn-primary" data-action="new-user">＋ Add Employee</button>')}
          <div class="notice" style="margin-bottom:16px">Sign-in is not server-side security. Anyone with the Apps Script deployment URL may access its Drive data. Do not store confidential information.</div>
          <div class="grid admin-grid"><section class="card"><div class="card-header"><h2>Employees</h2><span class="muted">${state.users.length} profiles</span></div><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Login Username</th><th>Role / Department</th><th>Date of Birth</th><th>Actions</th></tr></thead><tbody>${userRows}</tbody></table></div></section>
          <section class="card"><div class="card-header"><h2>Platform Settings</h2></div><div class="card-body"><form id="settings-form" class="settings-form">
            <div class="field"><label for="drive-url">Global Google Drive Link</label><input id="drive-url" type="url" placeholder="https://drive.google.com/drive/folders/…" value="${escapeHtml(state.driveUrl)}"></div>
            <button class="btn btn-primary">Save Settings</button>
          </form></div></section></div>`;
        $("#settings-form").addEventListener("submit", event => {
          event.preventDefault();
          const url = $("#drive-url").value.trim();
          if (url && safeUrl(url) === "#") { notify("Enter a valid link starting with http:// or https://.", true); return; }
          state.driveUrl = url;
          if (saveState()) { renderAdmin(); notify("Settings saved."); }
        });
        $("#content").querySelectorAll("[data-edit-user]").forEach(button => button.addEventListener("click", () => openUserModal(button.dataset.editUser)));
        $("#content").querySelectorAll("[data-delete-user]").forEach(button => button.addEventListener("click", () => removeUser(button.dataset.deleteUser)));
        wirePageActions();
      }
      function wirePageActions() {
        $("#content").querySelectorAll("[data-action='new-task']").forEach(button => button.addEventListener("click", openTaskModal));
        $("#content").querySelectorAll("[data-action='new-user']").forEach(button => button.addEventListener("click", () => openUserModal()));
        $("#content").querySelectorAll("[data-action='register-file']").forEach(button => button.addEventListener("click", openFileModal));
        $("#content").querySelectorAll("[data-goto]").forEach(button => button.addEventListener("click", () => { activePage = button.dataset.goto; renderApp(); }));
      }
      function showModal(title, body, onSubmit, submitLabel = "Save") {
        $("#modal-root").innerHTML = `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><form id="modal-form"><div class="modal-head"><h2>${escapeHtml(title)}</h2><button type="button" class="btn btn-sm" data-close>✕</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn btn-primary">${escapeHtml(submitLabel)}</button></div></form></section></div>`;
        $("#modal-form").addEventListener("submit", event => {
          event.preventDefault();
          const submit = $("#modal-form button[type='submit'], #modal-form .modal-foot button:not([type='button'])");
          if (submit) submit.disabled = true;
          Promise.resolve(onSubmit(new FormData(event.currentTarget))).catch(error => {
            console.error("Could not complete form action.", error);
            notify(error.message || "Could not save form data.", true);
          }).finally(() => { if (submit?.isConnected) submit.disabled = false; });
        });
        $("#modal-root").querySelectorAll("[data-close]").forEach(button => button.addEventListener("click", closeModal));
        $("#modal-root").querySelector(".modal-backdrop").addEventListener("click", event => { if (event.target.classList.contains("modal-backdrop")) closeModal(); });
        const first = $("#modal-form input, #modal-form select");
        first?.focus();
      }
      function closeModal() { $("#modal-root").innerHTML = ""; }
      function openUserModal(userId) {
        const user = userId ? userById(userId) : null;
        const field = (label, name, value, type = "text", required = true) => `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${escapeHtml(value || "")}" ${required ? "required" : ""}></div>`;
        const body = `<div class="form-grid">${field("First Name", "firstName", user?.firstName)}${field("Last Name", "lastName", user?.lastName)}<div class="field"><label>Login Username</label><input name="username" type="text" value="${escapeHtml(user?.username || "")}" autocomplete="off" required><span class="muted" style="font-size:10px">The employee's unique login, not their role or job title.</span></div>${field("Date of Birth", "birthDate", user?.birthDate, "date", false)}<div class="field full"><label>Role / Department</label><select name="department" required>${DEPARTMENTS.map(dep => `<option ${user?.department === dep ? "selected" : ""}>${dep}</option>`).join("")}</select></div></div>`;
        showModal(user ? "Edit Profile" : "Add Employee", body, form => {
          const data = Object.fromEntries(form.entries());
          const username = String(data.username).trim();
          if (state.users.some(item => item.username.toLowerCase() === username.toLowerCase() && item.id !== user?.id)) { notify("That username is already in use.", true); return; }
          const next = { ...user, id: user?.id || id(), ...data, username };
          if (user) {
            state.users = state.users.map(item => item.id === user.id ? next : item);
            state.tasks.forEach(task => { if (task.assigneeId === user.id) task.department = next.department; });
            if (session?.id === user.id) session = { ...session, ...next };
          } else state.users.push(next);
          if (!saveState()) return;
          closeModal(); renderApp(); notify(user ? "Profile updated." : "Employee added.");
        });
      }
      function removeUser(userId) {
        const user = userById(userId);
        if (!user) return;
        if (user.id === session.id) { notify("You cannot delete the profile you are currently signed in with.", true); return; }
        if (state.tasks.some(task => task.assigneeId === userId) && !confirm("This employee has assigned tasks. Delete their profile? The tasks will remain unassigned.")) return;
        if (!confirm(`Delete profile "${displayName(user)}"?`)) return;
        state.users = state.users.filter(item => item.id !== userId);
        state.tasks.forEach(task => { if (task.assigneeId === userId) { task.assigneeId = ""; task.department = user.department; } });
        if (!saveState()) return;
        renderAdmin(); notify("Profile deleted.");
      }
      function openTaskModal() {
        if (!canManage()) return notify("Only the CEO / Admin can create tasks.", true);
        const eligible = state.users.filter(user => user.department !== "CEO / Admin");
        const body = `<div class="form-grid"><div class="field full"><label>Task Title</label><input name="title" maxlength="160" required></div>
          <div class="field full"><label>Description</label><textarea name="description" maxlength="3000" placeholder="Expected outcome and completion criteria"></textarea></div>
          <div class="field"><label>Deadline</label><input name="deadline" type="date" required></div>
          <div class="field"><label>Assignee</label><select name="assigneeId" required>${eligible.map(user => `<option value="${escapeHtml(user.id)}">${escapeHtml(displayName(user))} — ${escapeHtml(user.department)}</option>`).join("")}</select></div>
          <div class="field full"><label>Task Attachments (optional, multiple files allowed)</label><input name="attachments" type="file" multiple><span class="muted" style="font-size:10px">Files are uploaded to the shared Google Drive folder. Maximum 20 MB per file.</span></div>
        </div>`;
        showModal("Create Task", body, async form => {
          const data = Object.fromEntries(form.entries());
          const user = userById(data.assigneeId);
          if (!user) return notify("Select an active employee.", true);
          const number = state.tasks.reduce((max, task) => Math.max(max, Number(task.id.match(/^TASK-(\d+)$/)?.[1] || 0)), 0) + 1;
          const attachments = Array.from(form.getAll("attachments"))
            .filter(file => file instanceof File && file.name)
            .map(file => ({
              id: id(),
              file,
              metadata: {
                id: null,
                name: file.name,
                size: file.size,
                type: file.type || "application/octet-stream"
              }
            }));
          attachments.forEach(item => { item.metadata.id = item.id; });
          try {
            await storeTaskAttachments(attachments);
          } catch (error) {
            console.error("Could not save task attachments.", error);
            notify(error.message || "Could not save task attachments.", true);
            return;
          }
          const task = { id: `TASK-${String(number).padStart(3,"0")}`, title: String(data.title).trim(), description: String(data.description).trim(), deadline: data.deadline, assigneeId: user.id, department: user.department, status: "Pending", assigneeViewed: false, createdAt: new Date().toISOString(), attachments: attachments.map(item => item.metadata) };
          state.tasks.unshift(task);
          if (!saveState()) {
            state.tasks.shift();
            try { await deleteTaskAttachments(attachments.map(item => item.id)); }
            catch (error) { console.error("Could not delete attachments after task save failed.", error); }
            await Promise.all(attachments.map(item => item.driveFileId ? postCloudAction({ action: "deleteFile", fileId: item.driveFileId }).catch(error => console.error("Could not remove a Drive attachment after task save failed.", error)) : Promise.resolve()));
            return;
          }
          closeModal(); renderApp(); notify("Task created.");
        });
      }
      function openFileModal() {
        const tasks = visibleTasks();
        if (!tasks.length) { notify("Create a task before registering a file.", true); return; }
        const body = `<div class="field"><label>File from Device</label><input name="file" type="file" required></div>
          <div class="field"><label>Linked Task</label><select name="taskId" required>${tasks.map(task => `<option value="${escapeHtml(task.id)}">${escapeHtml(task.id)} — ${escapeHtml(task.title)}</option>`).join("")}</select></div>
          <div class="field"><label>File Type</label><select name="tag"><option>ENG-3D</option><option>ENG-ELEC</option><option>ENG-SOFT</option><option>DOC-GENERAL</option></select><span class="muted" style="font-size:10px">The type is selected automatically based on the extension and can be changed.</span></div>
          <div class="notice">The file will be uploaded to the shared Google Drive folder and linked to this task. Maximum 20 MB.</div>`;
        showModal("Register File", body, async form => {
          const file = form.get("file");
          if (!(file instanceof File) || !file.name) return notify("Choose a file.", true);
          const task = state.tasks.find(item => item.id === form.get("taskId"));
          if (!task) return notify("The selected task is no longer available.", true);
          const tag = form.get("tag") || fileTypeFor(file);
          const sizeLabel = formatFileSize(file.size);
          const record = { id: id(), name: file.name, sizeLabel, bytes: file.size, type: file.type || "", tag, taskId: task.id, author: displayName(session), createdAt: new Date().toISOString(), comments: [] };
          try {
            const attachment = { id: record.id, file };
            await storeTaskAttachments([attachment]);
            record.driveFileId = attachment.driveFileId;
          } catch (error) {
            console.error("Could not save file to local storage.", error);
            notify(error.message || "Could not save the file.", true);
            return;
          }
          state.files.unshift(record);
          if (!saveState()) {
            state.files.shift();
            try { await deleteTaskAttachments([record.id]); }
            catch (error) { console.error("Could not delete file after record save failed.", error); }
            if (record.driveFileId) await postCloudAction({ action: "deleteFile", fileId: record.driveFileId }).catch(error => console.error("Could not remove Drive file after record save failed.", error));
            return;
          }
          selectedFileId = record.id;
          closeModal(); renderApp(); notify("File metadata registered.");
        }, "Register");
        $("#modal-form [name='file']").addEventListener("change", event => {
          const file = event.target.files[0];
          if (file) $("#modal-form [name='tag']").value = fileTypeFor(file);
        });
      }
      $("#employee-auth-form").addEventListener("submit", event => { event.preventDefault(); login(); });
      $("#logout").addEventListener("click", logout);
      $("#mobile-logout").addEventListener("click", logout);
      renderLogin();
      initializeCloud();
    })();
  </script>
</body>
</html>
