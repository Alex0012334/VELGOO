<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6f9">
  <title>VELGO | R&D Platform</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6f9;
      --panel: #ffffff;
      --panel-2: #f5f7fa;
      --panel-3: #e9eef4;
      --line: #d9e0e7;
      --text: #202b36;
      --muted: #687789;
      --blue: #1687d9;
      --blue-hover: #279ae9;
      --green: #42b883;
      --amber: #d7a84c;
      --red: #df6969;
      --radius: 8px;
      font: 14px/1.5 "Segoe UI", Inter, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; cursor: pointer; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .eyebrow { color: #7f91a3; text-transform: uppercase; letter-spacing: .12em; font-size: 10px; font-weight: 700; }
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fff; }
    .login-card { width: min(440px, 100%); padding: 32px; border: 1px solid #0d6eb4; color: #fff; background: #1687d9; border-radius: 12px; box-shadow: 0 24px 60px #123b5b26; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 14px; font-weight: 750; letter-spacing: .04em; }
    .brand-mark { display: block; width: 136px; height: 40px; flex: 0 0 auto; object-fit: contain; }
    .brand-caption { color: var(--muted); white-space: nowrap; }
    .login-card .brand-mark { filter: brightness(0) invert(1); }
    .login-card .brand-caption, .login-card > p, .login-card label, .login-card .cloud-connection { color: #e4f2fc; }
    .login-card h1 { margin: 28px 0 5px; font-size: 24px; }
    .login-card > p { margin: 0 0 24px; color: #e4f2fc; }
    .field { display: grid; gap: 6px; margin-bottom: 14px; }
    label { color: #465564; font-size: 12px; font-weight: 650; }
    input, select, textarea { width: 100%; color: var(--text); background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 10px 11px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px #1687d926; }
    textarea { min-height: 88px; resize: vertical; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); border-radius: 6px; color: var(--text); background: var(--panel-3); padding: 8px 12px; font-weight: 650; transition: .15s ease; }
    .btn:hover { background: #dce4ec; border-color: #b7c3cf; }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: white; }
    .btn-primary:hover { background: var(--blue-hover); border-color: var(--blue-hover); }
    .btn-danger { color: #ffaaaa; }
    .btn-sm { padding: 5px 9px; font-size: 12px; }
    .wide { width: 100%; }
    .login-actions { display: grid; gap: 9px; margin-top: 20px; }
    .cloud-connection { margin-top: 12px; color: #9eb4c5; font-size: 11px; }
    .cloud-connection.error { color: #ffdddd; }
    .cloud-connection button { margin-left: 6px; padding: 0; border: 0; color: #fff; background: none; text-decoration: underline; }
    .app-shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { display: flex; flex-direction: column; border-right: 1px solid #39434e; color: #e8edf2; background: #1b2027; padding: 18px 12px; }
    .sidebar .brand { padding: 2px 9px 22px; }
    .sidebar .brand-mark { width: 100px; height: 34px; }
    .nav-label { padding: 12px 10px 7px; color: #71808e; text-transform: uppercase; letter-spacing: .11em; font-size: 10px; font-weight: 700; }
    .nav-btn { width: 100%; display: flex; align-items: center; gap: 11px; padding: 10px; margin: 2px 0; color: #aeb9c4; text-align: left; background: transparent; border: 0; border-radius: 6px; }
    .nav-btn:hover { background: #252d36; color: #fff; }
    .nav-btn.active { color: white; background: #123d5c; box-shadow: inset 2px 0 var(--blue); }
    .nav-icon { width: 18px; text-align: center; color: #93a3b2; }
    .nav-unread-badge { display: inline-flex; min-width: 18px; height: 18px; align-items: center; justify-content: center; margin-left: auto; padding: 0 5px; border-radius: 99px; color: #fff; background: #d94343; font-size: 10px; font-weight: 750; line-height: 1; }
    .sidebar-bottom { margin-top: auto; border-top: 1px solid #303943; padding: 14px 8px 0; }
    .sidebar .brand-caption, .sidebar .user-chip small { color: #98a5b3; }
    .sidebar .btn { color: #e8edf2; border-color: #39434e; background: #2b343f; }
    .sidebar .btn:hover { background: #36414d; border-color: #536271; }
    .user-chip { display: flex; align-items: center; gap: 9px; padding: 6px 2px 13px; }
    .avatar { display: grid; place-items: center; width: 32px; height: 32px; flex: 0 0 auto; border-radius: 50%; color: #d9efff; background: #24577a; font-size: 12px; font-weight: 750; }
    .user-chip strong { display: block; font-size: 12px; }
    .user-chip small { display: block; color: var(--muted); font-size: 10px; }
    .main { min-width: 0; }
    .topbar { height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 28px; border-bottom: 1px solid #39434e; color: #e8edf2; background: #1c2229; }
    .topbar-title { font-weight: 680; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .topbar .btn { color: #e8edf2; border-color: #39434e; background: #2b343f; }
    .topbar .btn:hover { background: #36414d; border-color: #536271; }
    .local-badge { border: 1px solid #40515f; border-radius: 20px; padding: 4px 9px; color: #9eb4c5; font-size: 10px; }
    .local-badge button { margin-left: 4px; padding: 0; border: 0; color: #ffd1d1; background: none; font-size: inherit; text-decoration: underline; }
    .content { max-width: 1440px; margin: 0 auto; padding: 28px; }
    .page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .page-heading h1 { margin: 3px 0 4px; font-size: 24px; letter-spacing: -.025em; }
    .page-heading p { margin: 0; color: var(--muted); }
    .heading-actions { display: flex; gap: 8px; }
    .grid { display: grid; gap: 16px; }
    .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 18px; }
    .card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
    .stat-card { padding: 16px; }
    .stat-label { color: var(--muted); font-size: 12px; }
    .stat-value { margin-top: 5px; font-size: 26px; font-weight: 730; letter-spacing: -.03em; }
    .stat-foot { margin-top: 2px; color: #82909d; font-size: 11px; }
    .content.velgolife-content { display: flex; width: 100%; max-width: none; height: calc(100vh - 62px); flex-direction: column; overflow: hidden; padding: 16px 20px; }
    .velgolife-page-heading { flex: 0 0 auto; margin-bottom: 12px; }
    .velgolife-page-heading h1 { margin-bottom: 0; }
    .velgolife-layout { display: grid; flex: 1; min-height: 0; grid-template-columns: minmax(230px, .75fr) minmax(0, 1.65fr); gap: 12px; }
    .velgolife-summary { display: grid; min-width: 0; min-height: 0; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
    .velgolife-kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .velgolife-kpi { min-width: 0; min-height: 64px; padding: 8px 11px; }
    .velgolife-kpi .stat-value { margin-top: 2px; font-size: 24px; line-height: 1; }
    .velgolife-kpi .stat-label { font-size: 11px; }
    .velgolife-availability-card { min-height: 0; overflow: auto; }
    .velgolife-availability-card .card-header { padding: 8px 10px; }
    .velgolife-availability-card .card-body { display: grid; align-content: start; gap: 7px; padding: 8px 10px; }
    .velgolife-availability-item { display: grid; gap: 3px; }
    .velgolife-people-heading { display: grid; gap: 3px; padding-top: 2px; border-top: 1px solid var(--line); font-size: 10px; }
    .velgolife-availability-legend { flex-wrap: nowrap; gap: 4px; padding: 0; font-size: 8px; }
    .velgolife-availability-label { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 11px; }
    .velgolife-availability-label strong { margin-left: auto; font-size: 10px; white-space: nowrap; }
    .velgolife-color-dot { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; }
    .velgolife-color-dot.office { background: #42b883; }
    .velgolife-color-dot.online { background: #1687d9; }
    .velgolife-color-dot.unavailable { background: #778391; }
    .velgolife-bar-segment.office { fill: #42b883; }
    .velgolife-bar-segment.online { fill: #1687d9; }
    .velgolife-bar-segment.unavailable { fill: #778391; }
    .velgolife-progress { height: 6px; overflow: hidden; border-radius: 99px; background: #e9eef4; }
    .velgolife-progress span { display: block; height: 100%; border-radius: inherit; }
    .velgolife-progress .office { background: #42b883; }
    .velgolife-progress .online { background: #1687d9; }
    .velgolife-progress .unavailable { background: #778391; }
    .velgolife-availability-count { color: var(--muted); font-size: 9px; }
    .velgolife-chart-card { display: flex; min-width: 0; min-height: 0; flex-direction: column; }
    .velgolife-chart-card .card-header { flex: 0 0 auto; padding: 11px 14px; }
    .velgolife-chart-card .card-header h2 { font-size: 13px; }
    .velgolife-chart-caption { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .velgolife-availability-head { align-items: center; }
    .velgolife-availability-head .velgolife-chart-caption { margin: 0; font-size: 9px; white-space: nowrap; }
    .velgolife-legend { display: flex; flex: 0 0 auto; flex-wrap: wrap; gap: 7px 12px; padding: 9px 14px 0; color: #536171; font-size: 10px; }
    .velgolife-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .velgolife-legend.velgolife-availability-legend { flex-wrap: nowrap; gap: 4px; padding: 0; font-size: 8px; }
    .velgolife-legend i { width: 8px; height: 8px; border-radius: 50%; }
    .velgolife-legend .done { background: #1687d9; }
    .velgolife-legend .progress { background: #d7a84c; }
    .velgolife-legend .pending { background: #42b883; }
    .velgolife-legend .overdue { background: #df6969; }
    .velgolife-chart-area { display: flex; flex: 1; min-height: 0; flex-direction: column; overflow: auto; padding: 6px 12px 12px; }
    .velgolife-line-chart { display: block; width: 100%; min-height: 240px; flex: 1; }
    .velgolife-line-chart .grid-line { stroke: #e8edf2; stroke-width: 1; }
    .velgolife-line-chart .axis-label { fill: #687789; font: 10px "Segoe UI", Inter, system-ui, sans-serif; }
    .velgolife-line-chart .series-done { stroke: #1687d9; fill: #1687d9; }
    .velgolife-line-chart .series-progress { stroke: #d7a84c; fill: #d7a84c; }
    .velgolife-line-chart .series-pending { stroke: #42b883; fill: #42b883; }
    .velgolife-line-chart .series-overdue { stroke: #df6969; fill: #df6969; }
    .velgolife-line-chart .series-line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .velgolife-empty { display: grid; min-height: 180px; flex: 1; place-items: center; padding: 18px; color: var(--muted); text-align: center; font-size: 12px; }
    .velgolife-people-chart { display: block; width: 100%; height: auto; overflow: visible; }
    .velgolife-people-chart text { fill: #536171; font: 9px "Segoe UI", Inter, system-ui, sans-serif; }
    .velgolife-people-chart .bar-track { fill: #edf1f5; }
    .velgolife-bar-segment { stroke: #fff; stroke-width: 1; }
    .velgolife-people-scroll { min-height: 0; overflow: auto; }
    .two-col { grid-template-columns: minmax(0, 1.4fr) minmax(250px, .8fr); }
    .card-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 15px 17px; border-bottom: 1px solid var(--line); }
    .card-header h2, .card-header h3 { margin: 0; font-size: 14px; }
    .card-body { padding: 16px 17px; }
    .task-list { display: grid; }
    .task-row { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 12px; padding: 13px 17px; border-bottom: 1px solid #303943; }
    .task-row:last-child { border-bottom: 0; }
    .task-title { font-weight: 650; }
    .task-title-line { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .new-task-badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 99px; color: #fff; background: #b93636; font-size: 9px; font-weight: 750; line-height: 1.4; white-space: nowrap; }
    .task-meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .task-author { margin-bottom: 4px; font-weight: 650; }
    .schedule-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .schedule-week-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .schedule-week-label { min-width: 190px; text-align: center; font-weight: 650; }
    .schedule-legend { display: flex; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 11px; }
    .schedule-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .schedule-dot { width: 10px; height: 10px; border-radius: 3px; }
    .schedule-dot.office { background: #42b883; }
    .schedule-dot.online { background: #1687d9; }
    .schedule-dot.unavailable { background: #69737d; }
    .schedule-person-card { overflow: hidden; margin-bottom: 14px; }
    .schedule-person-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
    .schedule-person-name { font-weight: 700; }
    .schedule-own-label { margin-left: 6px; color: #7ebdec; font-size: 11px; font-weight: 500; }
    .schedule-table-wrap { overflow: auto; max-height: 640px; }
    .schedule-table { min-width: 800px; border-spacing: 0; }
    .schedule-table th { position: sticky; top: 0; z-index: 2; text-align: center; }
    .schedule-table th:first-child { left: 0; z-index: 3; min-width: 86px; text-align: left; }
    .schedule-table td { min-width: 96px; padding: 5px; text-align: center; background: var(--panel); }
    .schedule-table td:first-child { position: sticky; left: 0; z-index: 1; min-width: 86px; color: var(--muted); background: #1c2229; text-align: left; font-size: 11px; white-space: nowrap; }
    .availability-cell { width: 100%; min-height: 30px; padding: 4px; border: 1px solid #48525d; border-radius: 5px; color: #bec7cf; background: #252d36; font-size: 10px; }
    .availability-cell:disabled { opacity: 1; cursor: default; }
    .availability-cell.office { border-color: #316a50; color: #a7e4c4; background: #18553844; }
    .availability-cell.online { border-color: #315a78; color: #a1d4fa; background: #16466b44; }
    .availability-cell.unavailable { border-color: #48525d; color: #bec7cf; background: #303943; }
    .schedule-note { margin: 0 0 14px; }
    .status { display: inline-flex; align-items: center; border: 1px solid; border-radius: 99px; padding: 3px 8px; font-size: 10px; white-space: nowrap; }
    .status.todo { color: #c5a96e; border-color: #6b5936; background: #51412440; }
    .status.progress { color: #73b9ed; border-color: #315a78; background: #16466b44; }
    .status.done { color: #71d2a3; border-color: #316a50; background: #18553844; }
    .profile-layout { grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); align-items: start; }
    .profile-hero { padding: 22px; }
    .profile-person { display: flex; align-items: center; gap: 15px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
    .profile-person .avatar { width: 54px; height: 54px; font-size: 17px; }
    .profile-person h2 { margin: 0; font-size: 19px; }
    .profile-person p { margin: 2px 0 0; color: var(--muted); }
    .detail-list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
    .detail-label { color: var(--muted); font-size: 11px; }
    .detail-value { margin-top: 3px; font-weight: 600; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 11px 14px; color: #8d9ba8; background: #1c2229; text-transform: uppercase; letter-spacing: .06em; font-size: 10px; }
    td { padding: 12px 14px; border-top: 1px solid #303943; vertical-align: middle; }
    tr:hover td { background: #252d36; }
    .table-main { font-weight: 650; overflow-wrap: anywhere; word-break: break-word; }
    .table-sub { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; word-break: break-word; }
    .task-description-preview { display: block; width: 100%; max-width: 620px; min-width: 0; margin: 3px 0 0; padding: 0; border: 0; color: var(--muted); background: transparent; text-align: left; font-size: 11px; cursor: pointer; overflow-wrap: anywhere; word-break: break-word; }
    .task-description-preview:hover { color: #d3e6f4; }
    .task-description-preview span { color: #70baf0; white-space: nowrap; }
    .task-description-full { color: #d4dce4; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .filter-row input, .filter-row select { width: auto; min-width: 180px; padding: 8px 10px; }
    .empty { padding: 30px 16px; text-align: center; color: var(--muted); }
    .empty strong { display: block; margin-bottom: 5px; color: #c1cbd4; }
    .folder-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .folder-card { display: flex; min-height: 174px; flex-direction: column; align-items: flex-start; padding: 17px; color: var(--text); text-align: left; cursor: pointer; transition: .15s ease; }
    .folder-card:hover { border-color: #52718a; background: #252e37; transform: translateY(-2px); }
    .folder-icon { display: grid; width: 40px; height: 40px; place-items: center; margin-bottom: 15px; border: 1px solid #38526a; border-radius: 9px; color: #8bc7f2; background: #183247; font-size: 19px; }
    .folder-card strong { font-size: 14px; }
    .folder-card p { margin: 4px 0 14px; color: var(--muted); font-size: 11px; }
    .folder-card .folder-count { margin-top: auto; color: #8aa0b2; font-size: 10px; }
    .folder-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .file-layout { grid-template-columns: minmax(0,1fr) 300px; align-items: start; }
    .file-main { min-width: 0; }
    .file-list { position: sticky; top: 14px; overflow: hidden; }
    .file-list-items { display: grid; max-height: 620px; overflow: auto; }
    .file-list-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #303943; }
    .file-list-item:last-child { border-bottom: 0; }
    .file-list-item:hover, .file-list-item.active { background: #2a333d; }
    .file-list-item.active { box-shadow: inset 2px 0 var(--blue); }
    .file-list-select { flex: 1; min-width: 0; padding: 4px; border: 0; color: var(--text); background: transparent; text-align: left; cursor: pointer; }
    .file-list-delete { flex: 0 0 auto; padding: 5px 7px; border: 1px solid transparent; border-radius: 5px; color: #e58b8b; background: transparent; font-size: 11px; }
    .file-list-delete:hover { border-color: #744949; background: #422b2b; }
    .file-list-name { display: block; font-size: 12px; font-weight: 650; overflow-wrap: anywhere; }
    .file-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 5px 10px; margin-top: 6px; color: var(--muted); font-size: 10px; }
    .file-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .viewer-stage { position: relative; display: flex; min-height: 420px; max-height: 70vh; justify-content: center; align-items: center; overflow: auto; border: 1px solid #c9cdd1; border-radius: 7px; color: #4a4f54; background: #fff; }
    .viewer-stage.viewer-stage-3d { height: min(70vh,560px); min-height: 360px; overflow: hidden; }
    .viewer-stage.pdf-viewer { display: flex; height: min(70vh,800px); min-height: 420px; max-height: none; flex-direction: column; justify-content: flex-start; align-items: stretch; overflow: hidden; background: #e7eaed; }
    .pdf-toolbar { display: flex; flex: 0 0 auto; align-items: center; justify-content: center; gap: 8px; padding: 8px; border-bottom: 1px solid #c9cdd1; background: #f7f8f9; }
    .pdf-toolbar button { min-width: 34px; padding: 5px 8px; border: 1px solid #c9cdd1; border-radius: 5px; color: #30363b; background: #fff; }
    .pdf-toolbar button:disabled { opacity: .45; cursor: default; }
    .pdf-page-label { min-width: 90px; color: #454b51; text-align: center; font-size: 12px; }
    .pdf-page-container { display: flex; flex: 1; min-height: 0; justify-content: center; align-items: flex-start; overflow: auto; padding: 14px; }
    .pdf-page-container canvas { display: block; max-width: none; height: auto; background: #fff; box-shadow: 0 2px 8px #0003; }
    .pdf-loading { margin: auto; padding: 20px; color: #525960; text-align: center; }
    .viewer-stage img { display: block; max-width: 100%; max-height: 68vh; object-fit: contain; }
    .viewer-stage iframe { display: block; width: 100%; height: 68vh; min-height: 420px; border: 0; background: #fff; }
    .viewer-stage pre { width: 100%; align-self: stretch; margin: 0; padding: 20px; overflow: auto; color: #30363b; background: #fff; font: 12px/1.55 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .viewer-stage canvas { display: block; width: 100%; height: 100%; min-height: 420px; cursor: grab; touch-action: none; }

  <script>
    (() => {

      const STATUSES = ["Pending", "In Progress", "Done"];

        { id: "social-media", name: "Social Media", icon: "◉", description: "Campaigns, photos, and media assets." },

      ];

      const MAX_3D_PREVIEW_BYTES = 25*1024*1024;
      const PDFJS_SCRIPT_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      const PDFJS_WORKER_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const STATUS_CLASS = { "Pending": "todo", "In Progress": "progress", "Done": "done" };
      const NAV_ITEMS = [
        ["dashboard", "⌂", "Overview"], ["profile", "◉", "Profile"], ["tasks", "☷", "Plan and Tasks"],
        ["velgolife", "▤", "VelgoLife"], ["schedule", "▦", "Schedule"],

      ];
      const AVAILABILITY_OPTIONS = [
        { value: "office", label: "In office" },
        { value: "online", label: "Online only" },
        { value: "unavailable", label: "Unavailable" }
      ];
      const $ = (selector, root = document) => root.querySelector(selector);
      const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
      const id = () => (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);
      const initialState = () => ({
        users: [
          { id: "u-ceo", username: "alexey.volkov", firstName: "Alexey", lastName: "Volkov", birthDate: "1985-04-12", department: "CEO / Admin" },
          { id: "u-mech", username: "irina.sokolova", firstName: "Irina", lastName: "Sokolova", birthDate: "1992-09-03", department: "Mechanical Engineer" },
          { id: "u-elec", username: "dmitry.orlov", firstName: "Dmitry", lastName: "Orlov", birthDate: "1990-02-18", department: "Electrical Engineer" },
          { id: "u-soft", username: "maria.kim", firstName: "Maria", lastName: "Kim", birthDate: "1995-11-27", department: "Software Engineer" }
        ],
        tasks: [
          { id: "TASK-001", title: "Controller housing: revision B", description: "Check mounting clearances and prepare the updated CAD model.", deadline: "2026-11-25", assigneeId: "u-mech", department: "Mechanical Engineer", status: "In Progress", createdAt: new Date().toISOString() },
          { id: "TASK-002", title: "Prototype power schematic", description: "Prepare the power schematic and component list.", deadline: "2026-11-30", assigneeId: "u-elec", department: "Electrical Engineer", status: "Pending", createdAt: new Date().toISOString() },
          { id: "TASK-003", title: "Firmware bootloader test", description: "Check error handling during firmware updates.", deadline: "2026-12-03", assigneeId: "u-soft", department: "Software Engineer", status: "Done", createdAt: new Date().toISOString() }
        ],
        files: [],
        availability: {},
        driveUrl: "",
        adminPassword: "admin123"
      });
      function loadState() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (!parsed || !Array.isArray(parsed.users) || !Array.isArray(parsed.tasks) || !Array.isArray(parsed.files)) return initialState();
          const restored = { ...initialState(), ...parsed };
          if (!restored.availability || typeof restored.availability !== "object" || Array.isArray(restored.availability)) restored.availability = {};
          const demoUsernameMigrations = {
            "u-ceo": ["ceo", "alexey.volkov"],
            "u-mech": ["engineer", "irina.sokolova"],
            "u-elec": ["electro", "dmitry.orlov"],
            "u-soft": ["developer", "maria.kim"]
          };
          let migrated = false;
          restored.users.forEach(user => {
            const migration = demoUsernameMigrations[user.id];
            if (migration && user.username === migration[0]) {
              user.username = migration[1];
              migrated = true;
            }
          });
          const legacyStatuses = { "Не выполнено": "Pending", "В процессе": "In Progress", "Сделано": "Done" };
          restored.tasks.forEach(task => {
            if (legacyStatuses[task.status]) {
              task.status = legacyStatuses[task.status];
              migrated = true;
            }
          });
          if (migrated) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(restored)); }
            catch (error) { console.error("Could not save migrated demo usernames or task statuses.", error); }
          }
          return restored;
        } catch (error) {
          console.error("Could not read platform data from localStorage.", error);
          return initialState();
        }
      }
      let state = loadState();
      let cloudReady = false;
      let cloudLastError = null;
      let cloudSaveQueue = Promise.resolve();
      let cloudBaseState = null;
      let cloudSavePending = 0;
      let cloudPollTimer = null;
      let cloudPollInFlight = false;
      let session = null;
      let activePage = "dashboard";
      let scheduleWeekOffset = 0;
      let selectedFileId = null;
      let activeFileFolder = null;
      let viewerObjectUrl = null;
      let viewerCleanup = null;
      let previewGeneration = 0;
      const cadDecoderCache = new Map();
      let decodedCadCache = null;
      let pdfJsPromise = null;
      let activePdfLoadingTask = null;
      let activePdfRenderTask = null;
      let toastTimer;
      function setCloudStatus(message, error = false, retry = false) {
        const status = `${escapeHtml(message)}${retry ? ` <button type="button" data-cloud-retry>Retry</button>` : ""}`;
        const loginStatus = $("#login-cloud-status");
        const appStatus = $("#app-cloud-status");
        if (loginStatus) {
          loginStatus.innerHTML = status;
          loginStatus.classList.toggle("error", error);
          loginStatus.classList.toggle("hidden", !error);
        }
        if (appStatus) {
          appStatus.innerHTML = error ? `● DRIVE SYNC ERROR${retry ? ` <button type="button" data-cloud-retry>Retry</button>` : ""}` : `● ${escapeHtml(message.toUpperCase())}`;
          appStatus.classList.toggle("error", error);
          appStatus.classList.toggle("hidden", !error);
        }
        document.querySelectorAll("[data-cloud-retry]").forEach(button => button.addEventListener("click", initializeCloud));
      }
      function loadRemoteJsonp(action, params = {}) {
        return new Promise((resolve, reject) => {
          const callbackName = `__velgoCallback_${id().replace(/-/g, "")}`;
          const script = document.createElement("script");
          const query = new URLSearchParams({ action, callback: callbackName, ...params, _ts: String(Date.now()) });
          const cleanup = () => {
            delete window[callbackName];
            script.remove();
            clearTimeout(timer);
          };
          const timer = setTimeout(() => { cleanup(); reject(new Error("Google Drive did not respond in time.")); }, 45000);
          window[callbackName] = value => { cleanup(); resolve(value); };
          script.onerror = () => { cleanup(); reject(new Error("Could not reach the Google Drive service.")); };
          script.src = `${DRIVE_API_URL}?${query}`;
          document.head.append(script);
        });
      }
      function postCloudAction(action) {
        return new Promise((resolve, reject) => {
          const requestId = id();
          const iframe = document.createElement("iframe");
          const form = document.createElement("form");
          const frameName = `velgo-cloud-${requestId.replace(/-/g, "")}`;
          iframe.name = frameName;
          iframe.className = "hidden";
          iframe.setAttribute("aria-hidden", "true");
          form.method = "POST";
          form.action = DRIVE_API_URL;
          form.target = frameName;
          form.className = "hidden";
          const payload = { ...action, requestId };
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = "payload";
          input.value = JSON.stringify(payload);
          form.append(input);
          let settled = false;
          let lastPollError = null;
          let pollTimer;
          const cleanup = () => {
            window.removeEventListener("message", onMessage);
            clearTimeout(timer);
            clearTimeout(pollTimer);
            iframe.remove();
            form.remove();
          };
          const finish = (error, value) => {
            if (settled) return;
            settled = true;
            cleanup();
            error ? reject(error) : resolve(value);
          };
          const onMessage = event => {
            if (event.data?.requestId !== requestId) return;
            if (event.data.ok) finish(null, event.data.result);
            else finish(new Error(event.data.error || "Google Drive rejected the request."));
          };
          const pollResult = async () => {
            try {
              const response = await loadRemoteJsonp("result", { requestId });
              if (response?.requestId === requestId) {
                if (!response.ok) {
                  finish(new Error(response.error || "Google Drive rejected the request."));
                  return;
                }
                let result = response.result;
                if (action.action === "saveState") {
                  const envelope = await loadRemoteJsonp("load");
                  if (!envelope?.state) throw new Error("Google Drive did not return the saved platform state.");
                  result = { ...result, state: envelope.state };
                }
                finish(null, result);
                return;
              }
            } catch (error) {
              lastPollError = error;
            }
            if (!settled) pollTimer = setTimeout(pollResult, 750);
          };
          const timer = setTimeout(() => finish(
            lastPollError || new Error("Google Drive did not confirm the save. Check the Apps Script deployment and try again.")
          ), 60000);
          window.addEventListener("message", onMessage);
          document.body.append(iframe, form);
          form.submit();
          pollTimer = setTimeout(pollResult, 400);
        });
      }
      function stateForCloud() {
        const cloudState = { ...state };
        delete cloudState.adminPassword;
        return cloudState;
      }
      function cloneState(value) {
        return value == null ? value : JSON.parse(JSON.stringify(value));
      }
      function mergeConcurrentState(base, local, remote) {
        const same = (left, right) => JSON.stringify(left) === JSON.stringify(right);
        if (same(local, base)) return cloneState(remote);
        if (same(remote, base) || same(local, remote)) return cloneState(local);
        const isRecord = value => value !== null && typeof value === "object" && !Array.isArray(value);
        if (Array.isArray(base) && Array.isArray(local) && Array.isArray(remote) &&
            [...base, ...local, ...remote].every(item => item && isRecord(item) && item.id)) {
          const byId = items => new Map(items.map(item => [String(item.id), item]));
          const baseById = byId(base);
          const localById = byId(local);
          const remoteById = byId(remote);
          const ids = [...new Set([...localById.keys(), ...remoteById.keys()])];
          return ids.flatMap(itemId => {
            const inBase = baseById.has(itemId);
            const inLocal = localById.has(itemId);
            const inRemote = remoteById.has(itemId);
            if (!inLocal && !inRemote) return [];
            if (inBase && !inLocal) return same(remoteById.get(itemId), baseById.get(itemId)) ? [] : [remoteById.get(itemId)];
            if (inBase && !inRemote) return same(localById.get(itemId), baseById.get(itemId)) ? [] : [localById.get(itemId)];
            if (inLocal && inRemote) {
              return [inBase
                ? mergeConcurrentState(baseById.get(itemId), localById.get(itemId), remoteById.get(itemId))
                : mergeConcurrentState({}, localById.get(itemId), remoteById.get(itemId))];
            }
            return [inLocal ? localById.get(itemId) : remoteById.get(itemId)];
          });
        }
        if (Array.isArray(base) && Array.isArray(local) && Array.isArray(remote)) {
          const isAppendOnly = items => base.every((item, index) => same(item, items[index]));
          if (isAppendOnly(local) && isAppendOnly(remote)) {
            const merged = cloneState(base);
            [...local.slice(base.length), ...remote.slice(base.length)].forEach(item => {
              if (!merged.some(existing => same(existing, item))) merged.push(cloneState(item));
            });
            return merged;
          }
        }
        if (isRecord(base) && isRecord(local) && isRecord(remote)) {
          const result = {};
          const keys = new Set([...Object.keys(base), ...Object.keys(local), ...Object.keys(remote)]);
          keys.forEach(key => {

          key: `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`,
          total: 0,
          counts: { done: 0, progress: 0, pending: 0, overdue: 0 }
        }));
        const bucketByMonth = new Map(buckets.map(bucket => [bucket.key, bucket]));
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        datedTasks.forEach(({ task, date }) => {
          const bucket = bucketByMonth.get(`${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`);
          if (!bucket) return;
          bucket.total += 1;
          if (task.status === "Done") bucket.counts.done += 1;
          else if (date < today) bucket.counts.overdue += 1;
          else if (task.status === "In Progress") bucket.counts.progress += 1;
          else bucket.counts.pending += 1;
        });
        if (!buckets.some(bucket => bucket.total)) return `<div class="velgolife-empty">No tasks fall within the latest six deadline months.</div>`;
        const series = [
          { key: "done", label: "Completed", className: "done" },
          { key: "progress", label: "In progress", className: "progress" },
          { key: "pending", label: "Pending", className: "pending" },
          { key: "overdue", label: "Overdue", className: "overdue" }
        ];
        const x = index => 58 + index * 100;
        const y = percent => 205 - percent * 1.65;
        const grid = [0, 25, 50, 75, 100].map(percent => {
          const lineY = y(percent);
          return `<line class="grid-line" x1="52" y1="${lineY}" x2="570" y2="${lineY}"></line><text class="axis-label" x="42" y="${lineY + 3}" text-anchor="end">${percent}%</text>`;
        }).join("");
        const seriesMarkup = series.map(item => {
          let path = "";
          let hasPreviousPoint = false;
          const points = buckets.map((bucket, index) => {
            if (!bucket.total) {
              hasPreviousPoint = false;
              return "";
            }
            const percent = bucket.counts[item.key] / bucket.total * 100;
            const command = hasPreviousPoint ? "L" : "M";
            hasPreviousPoint = true;
            path += `${command}${x(index)},${y(percent)} `;
            const monthLabel = bucket.date.toLocaleDateString("en-GB", { month: "short", year: "numeric" });
            return `<circle class="series-${item.className}" cx="${x(index)}" cy="${y(percent)}" r="3.5"><title>${escapeHtml(monthLabel)} · ${item.label}: ${Math.round(percent)}% (${bucket.counts[item.key]} of ${bucket.total})</title></circle>`;
          }).join("");
          return `<path class="series-${item.className} series-line" d="${path.trim()}"></path>${points}`;
        }).join("");
        const monthLabels = buckets.map((bucket, index) => `<text class="axis-label" x="${x(index)}" y="235" text-anchor="middle">${escapeHtml(bucket.date.toLocaleDateString("en-GB", { month: "short", year: "2-digit" }))}</text>`).join("");
        return `<svg class="velgolife-line-chart" viewBox="0 0 600 255" role="img" aria-label="Task status percentages grouped by deadline month for the latest six months">
          ${grid}${seriesMarkup}${monthLabels}</svg>`;
      }
      function peopleAvailabilitySvg(people) {

        const width = 250;
        const labelWidth = 98;
        const barWidth = 145;

        const rows = people.map((person, index) => {

          const shortName = fullName.length > 14 ? `${fullName.slice(0, 13)}…` : fullName;

      function scheduleDateKey(date) {

      function updateTaskStatus(taskId, status) {

        if (!saveState()) return;
        renderApp();

      async function deleteTask(taskId) {
        const task = state.tasks.find(item => item.id === taskId);
        if (!task || !canDeleteTask(task)) {
          notify("You can only delete tasks you created.", true);
          return;
        }
        const attachments = task.attachments || [];
        const attachmentNotice = attachments.length ? ` and its ${attachments.length} attachment${attachments.length === 1 ? "" : "s"}` : "";
        if (!confirm(`Delete "${task.title}"${attachmentNotice}? This cannot be undone.`)) return;
        const previousTasks = state.tasks;
        state.tasks = state.tasks.filter(item => item.id !== taskId);
        if (!saveState()) {
          state.tasks = previousTasks;
          return;
        }
        await cloudSaveQueue;
        if (cloudLastError) {
          state.tasks = previousTasks;
          saveState();
          notify("Task was not deleted because Drive could not save the updated task list.", true);
          return;
        }
        let cleanupFailed = false;
        try {
          await deleteTaskAttachments(attachments.map(file => file.id));
        } catch (error) {
          console.error("Could not remove task attachments from local storage.", error);
          cleanupFailed = true;
        }
        for (const attachment of attachments) {
          if (!attachment.driveFileId) continue;
          try {
            await postCloudAction({ action: "deleteFile", fileId: attachment.driveFileId });
          } catch (error) {
            console.error("Could not delete a task attachment from Google Drive.", error);
            cleanupFailed = true;
          }
        }
        renderApp();
        notify(cleanupFailed ? "Task deleted, but some attachments could not be removed." : "Task deleted.", cleanupFailed);
      }
      function safeUrl(url) {

      function fileTypeFor(file) {

          const cosY = Math.cos(yaw), sinY = Math.sin(yaw), cosP = Math.cos(pitch), sinP = Math.sin(pitch);
          const scale = Math.min(width,height) * .78 * zoom;
          const projected = normalized.map(triangle => {
            const transformed = triangle.map(([x,y,z]) => {
              const rx = x*cosY - z*sinY, rz = x*sinY + z*cosY;
              const ry = y*cosP - rz*sinP, depth = y*sinP + rz*cosP;
              return { x: width/2 + rx*scale, y: height/2 - ry*scale, z: depth };
            });
            const [a,b,c] = transformed;
            const ux=b.x-a.x, uy=b.y-a.y, vx=c.x-a.x, vy=c.y-a.y;
            const light = Math.min(1,Math.max(0,Math.abs(ux*vy-uy*vx)/(scale*scale)*2));
            return { points: transformed, depth: transformed.reduce((sum,p)=>sum+p.z,0)/3, light };
          }).sort((a,b)=>a.depth-b.depth);
          projected.forEach(face => {
            const shade = Math.round(145 + face.light*70);
            ctx.beginPath();
            face.points.forEach((point,index)=>index?ctx.lineTo(point.x,point.y):ctx.moveTo(point.x,point.y));
            ctx.closePath();
            ctx.fillStyle = `rgb(${shade},${shade},${shade})`;
            ctx.fill();
            ctx.strokeStyle = "rgba(70,75,80,.22)";
            ctx.lineWidth = .55;
            ctx.stroke();
          });
        };
        const onDown = event => { dragging = true; previous = [event.clientX,event.clientY]; canvas.setPointerCapture(event.pointerId); };
        const onMove = event => {
          if (!dragging || !previous) return;
          yaw += (event.clientX-previous[0])*.012;
          pitch = Math.max(-1.5,Math.min(1.5,pitch+(event.clientY-previous[1])*.012));
          previous = [event.clientX,event.clientY]; scheduleRender();
        };
        const onUp = () => { dragging = false; previous = null; };
        const onWheel = event => {
          if (!event.ctrlKey) return;
          event.preventDefault();
          zoom = Math.max(.25,Math.min(4,zoom*(event.deltaY<0?1.1:.9)));
          scheduleRender();
        };
        canvas.addEventListener("pointerdown",onDown);
        canvas.addEventListener("pointermove",onMove);
        canvas.addEventListener("pointerup",onUp);
        canvas.addEventListener("pointercancel",onUp);
        canvas.addEventListener("wheel",onWheel,{passive:false});
        const observer = new ResizeObserver(scheduleRender); observer.observe(canvas);
        render();
        return () => {
          observer.disconnect();
          if (renderFrame) cancelAnimationFrame(renderFrame);
          canvas.removeEventListener("pointerdown",onDown);
          canvas.removeEventListener("pointermove",onMove);
          canvas.removeEventListener("pointerup",onUp);
          canvas.removeEventListener("pointercancel",onUp);
          canvas.removeEventListener("wheel",onWheel);
        };
      }
      function addComment(fileId, text) {
        const file = state.files.find(item => item.id === fileId);
        if (!file || !text.trim()) return;
        file.comments = file.comments || [];
        file.comments.push({ id: id(), author: displayName(session), text: text.trim(), createdAt: new Date().toISOString() });
        if (!saveState()) return;
        renderFiles();
        notify("Comment added.");
      }
      async function deleteFile(fileId) {
        const target = state.files.find(file => file.id === fileId);
        if (!target || !canDeleteFile(target) || !confirm("Delete this file and its comments from the shared library?")) return;
        const driveFileId = target.driveFileId;
        const previousFiles = state.files;
        const previousSelectedFileId = selectedFileId;
        state.files = state.files.filter(file => file.id !== fileId);
        if (selectedFileId === fileId) selectedFileId = null;
        if (!saveState()) { state.files = previousFiles; selectedFileId = previousSelectedFileId; return; }
        await cloudSaveQueue;
        if (cloudLastError) {
          state.files = previousFiles;
          selectedFileId = previousSelectedFileId;
          saveState();
          notify("File was not deleted because Drive could not save the updated file list.", true);
          return;
        }
        let cleanupFailed = false;
        try { await deleteTaskAttachments([fileId]); }
        catch (error) {
          console.error("Could not remove file contents from local storage.", error);
          cleanupFailed = true;
        }
        if (driveFileId) {
          try { await postCloudAction({ action: "deleteFile", fileId: driveFileId }); }
          catch (error) {
            console.error("Could not delete the file from Google Drive.", error);
            cleanupFailed = true;
          }
        }
        renderFiles();
        notify(cleanupFailed ? "The file record was removed, but some stored file contents could not be cleared." : "File deleted.", cleanupFailed);
      }
      function renderAdmin() {
        if (!isAdmin()) { activePage = "dashboard"; return renderApp(); }
        const userRows = state.users.map(user => `<tr><td><div class="table-main">${escapeHtml(displayName(user))}</div></td><td><code>${escapeHtml(user.username)}</code></td><td>${escapeHtml(user.department)}</td><td>${fmtDate(user.birthDate)}</td><td>${escapeHtml(user.email || "Not set")}</td><td><button class="btn btn-sm" data-edit-user="${escapeHtml(user.id)}">Edit</button> <button class="btn btn-sm btn-danger" data-delete-user="${escapeHtml(user.id)}">Delete</button></td></tr>`).join("");
        $("#content").innerHTML = `${pageHeading("Platform Management", "Employees and Google Drive", "Add employees, assign usernames, and configure the shared Drive link.", '<button class="btn btn-primary" data-action="new-user">＋ Add Employee</button>')}
          <div class="grid admin-grid"><section class="card"><div class="card-header"><h2>Employees</h2><span class="muted">${state.users.length} profiles</span></div><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Login Username</th><th>Role / Department</th><th>Date of Birth</th><th>Email Address</th><th>Actions</th></tr></thead><tbody>${userRows}</tbody></table></div></section>
          <section class="card"><div class="card-header"><h2>Platform Settings</h2></div><div class="card-body"><form id="settings-form" class="settings-form">
            <div class="field"><label for="drive-url">Global Google Drive Link</label><input id="drive-url" type="url" placeholder="https://drive.google.com/drive/folders/…" value="${escapeHtml(state.driveUrl)}"></div>
            <button class="btn btn-primary">Save Settings</button>
          </form></div></section></div>`;
        $("#settings-form").addEventListener("submit", event => {
          event.preventDefault();
          const url = $("#drive-url").value.trim();
          if (url && safeUrl(url) === "#") { notify("Enter a valid link starting with http:// or https://.", true); return; }
          state.driveUrl = url;
          if (saveState()) { renderAdmin(); notify("Settings saved."); }
        });
        $("#content").querySelectorAll("[data-edit-user]").forEach(button => button.addEventListener("click", () => openUserModal(button.dataset.editUser)));
        $("#content").querySelectorAll("[data-delete-user]").forEach(button => button.addEventListener("click", () => removeUser(button.dataset.deleteUser)));
        wirePageActions();
      }
      function wirePageActions() {
        $("#content").querySelectorAll("[data-action='new-task']").forEach(button => button.addEventListener("click", openTaskModal));
        $("#content").querySelectorAll("[data-action='new-user']").forEach(button => button.addEventListener("click", () => openUserModal()));
        $("#content").querySelectorAll("[data-action='register-file']").forEach(button => button.addEventListener("click", openFileModal));
        $("#content").querySelectorAll("[data-goto]").forEach(button => button.addEventListener("click", () => { activePage = button.dataset.goto; renderApp(); }));
      }
      function showModal(title, body, onSubmit, submitLabel = "Save") {
        $("#modal-root").innerHTML = `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><form id="modal-form"><div class="modal-head"><h2>${escapeHtml(title)}</h2><button type="button" class="btn btn-sm" data-close>✕</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn btn-primary">${escapeHtml(submitLabel)}</button></div></form></section></div>`;
        $("#modal-form").addEventListener("submit", event => {
          event.preventDefault();
          const submit = $("#modal-form button[type='submit'], #modal-form .modal-foot button:not([type='button'])");
          if (submit) submit.disabled = true;
          Promise.resolve(onSubmit(new FormData(event.currentTarget))).catch(error => {
            console.error("Could not complete form action.", error);
            notify(error.message || "Could not save form data.", true);
          }).finally(() => { if (submit?.isConnected) submit.disabled = false; });
        });
        $("#modal-root").querySelectorAll("[data-close]").forEach(button => button.addEventListener("click", closeModal));
        $("#modal-root").querySelector(".modal-backdrop").addEventListener("click", event => { if (event.target.classList.contains("modal-backdrop")) closeModal(); });
        const first = $("#modal-form input, #modal-form select");
        first?.focus();
      }
      function closeModal() { $("#modal-root").innerHTML = ""; }
      function openUserModal(userId) {
        const user = userId ? userById(userId) : null;
        const field = (label, name, value, type = "text", required = true) => `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${escapeHtml(value || "")}" ${required ? "required" : ""}></div>`;
        const body = `<div class="form-grid">${field("First Name", "firstName", user?.firstName)}${field("Last Name", "lastName", user?.lastName)}<div class="field"><label>Login Username</label><input name="username" type="text" value="${escapeHtml(user?.username || "")}" autocomplete="off" required><span class="muted" style="font-size:10px">The employee's unique login, not their role or job title.</span></div>${field("Email Address", "email", user?.email, "email", !user)}${field("Date of Birth", "birthDate", user?.birthDate, "date", false)}<div class="field full"><label>Role / Department</label><select name="department" required>${DEPARTMENTS.map(dep => `<option ${user?.department === dep ? "selected" : ""}>${dep}</option>`).join("")}</select></div></div>`;
        showModal(user ? "Edit Profile" : "Add Employee", body, form => {
          const data = Object.fromEntries(form.entries());
          const username = String(data.username).trim();
          if (state.users.some(item => item.username.toLowerCase() === username.toLowerCase() && item.id !== user?.id)) { notify("That username is already in use.", true); return; }
          const next = { ...user, id: user?.id || id(), ...data, username };
          if (user) {
            state.users = state.users.map(item => item.id === user.id ? next : item);
            state.tasks.forEach(task => { if (task.assigneeId === user.id) task.department = next.department; });
            if (session?.id === user.id) session = { ...session, ...next };
          } else state.users.push(next);
          if (!saveState()) return;
          closeModal(); renderApp(); notify(user ? "Profile updated." : "Employee added.");
        });
      }
      function removeUser(userId) {
        const user = userById(userId);
        if (!user) return;
        if (user.id === session.id) { notify("You cannot delete the profile you are currently signed in with.", true); return; }
        if (state.tasks.some(task => task.assigneeId === userId) && !confirm("This employee has assigned tasks. Delete their profile? The tasks will remain unassigned.")) return;
        if (!confirm(`Delete profile "${displayName(user)}"?`)) return;
        state.users = state.users.filter(item => item.id !== userId);
        state.tasks.forEach(task => { if (task.assigneeId === userId) { task.assigneeId = ""; task.department = user.department; } });
        if (!saveState()) return;
        renderAdmin(); notify("Profile deleted.");
      }
      function openTaskModal() {
        if (!canManage()) return notify("Only the CEO / Admin can create tasks.", true);
        const eligible = state.users;
        const body = `<div class="form-grid"><div class="field full"><label>Task Title</label><input name="title" maxlength="160" required></div>
          <div class="field full"><label>Description</label><textarea name="description" maxlength="3000" placeholder="Expected outcome and completion criteria"></textarea></div>
          <div class="field"><label>Deadline</label><input name="deadline" type="date" required></div>
          <div class="field"><label>Assignee</label><select name="assigneeId" required>${eligible.map(user => `<option value="${escapeHtml(user.id)}">${escapeHtml(displayName(user))} — ${escapeHtml(user.department)}</option>`).join("")}</select></div>
          <div class="field full"><label>Task Attachments (optional, multiple files allowed)</label><input name="attachments" type="file" multiple><span class="muted" style="font-size:10px">Files are uploaded to the shared Google Drive folder. Maximum 20 MB per file.</span></div>
        </div>`;
        showModal("Create Task", body, async form => {
          const data = Object.fromEntries(form.entries());
          const user = userById(data.assigneeId);
          if (!user) return notify("Select an active employee.", true);
          const number = state.tasks.reduce((max, task) => Math.max(max, Number(task.id.match(/^TASK-(\d+)$/)?.[1] || 0)), 0) + 1;
          const attachments = Array.from(form.getAll("attachments"))
            .filter(file => file instanceof File && file.name)
            .map(file => ({
              id: id(),
              file,
              metadata: {
                id: null,
                name: file.name,
                size: file.size,
                type: file.type || "application/octet-stream"
              }
            }));
          attachments.forEach(item => { item.metadata.id = item.id; });
          try {
            await storeTaskAttachments(attachments);
          } catch (error) {
            console.error("Could not save task attachments.", error);
            notify(error.message || "Could not save task attachments.", true);
            return;
          }
          const task = { id: `TASK-${String(number).padStart(3,"0")}`, title: String(data.title).trim(), description: String(data.description).trim(), deadline: data.deadline, assigneeId: user.id, department: user.department, createdBy: session.id, createdByName: displayName(session), status: "Pending", assigneeViewed: false, createdAt: new Date().toISOString(), attachments: attachments.map(item => item.metadata) };
          state.tasks.unshift(task);
          if (!saveState()) {
            state.tasks.shift();
            try { await deleteTaskAttachments(attachments.map(item => item.id)); }
            catch (error) { console.error("Could not delete attachments after task save failed.", error); }
            await Promise.all(attachments.map(item => item.driveFileId ? postCloudAction({ action: "deleteFile", fileId: item.driveFileId }).catch(error => console.error("Could not remove a Drive attachment after task save failed.", error)) : Promise.resolve()));
            return;
          }
          closeModal(); renderApp(); notify("Task created.");
        });
      }
      function openFileModal() {
        const tasks = visibleTasks();
        if (!tasks.length) { notify("Create a task before registering a file.", true); return; }
        const defaultFolder = activeFileFolder || fileFolderForDepartment(tasks[0]?.department) || "social-media";
        const body = `<div class="field"><label>File from Device</label><input name="file" type="file" required></div>
          <div class="field"><label>Folder</label><select name="folder" required>${FILE_FOLDERS.map(folder => `<option value="${folder.id}" ${folder.id === defaultFolder ? "selected" : ""}>${folder.name}</option>`).join("")}</select><span class="muted" style="font-size:10px">PDFs and photos can be placed in any folder.</span></div>
          <div class="field"><label>Linked Task</label><select name="taskId" required>${tasks.map(task => `<option value="${escapeHtml(task.id)}">${escapeHtml(task.id)} — ${escapeHtml(task.title)}</option>`).join("")}</select></div>
          <div class="field"><label>File Type</label><select name="tag"><option>ENG-3D</option><option>ENG-ELEC</option><option>ENG-SOFT</option><option>DOC-GENERAL</option></select><span class="muted" style="font-size:10px">The type is selected automatically based on the extension and can be changed.</span></div>
          <div class="notice">The file will be uploaded to the shared Google Drive folder and linked to this task. Maximum 20 MB.</div>`;
        showModal("Register File", body, async form => {
          const file = form.get("file");
          if (!(file instanceof File) || !file.name) return notify("Choose a file.", true);
          const task = state.tasks.find(item => item.id === form.get("taskId"));
          if (!task) return notify("The selected task is no longer available.", true);
          const tag = form.get("tag") || fileTypeFor(file);
          const sizeLabel = formatFileSize(file.size);
          const record = { id: id(), name: file.name, sizeLabel, bytes: file.size, type: file.type || "", tag, folder: form.get("folder"), taskId: task.id, author: displayName(session), createdBy: session.id, createdAt: new Date().toISOString(), comments: [] };
          try {
            const attachment = { id: record.id, file };
            await storeTaskAttachments([attachment]);
            record.driveFileId = attachment.driveFileId;
          } catch (error) {
            console.error("Could not save file to local storage.", error);
            notify(error.message || "Could not save the file.", true);
            return;
          }
          state.files.unshift(record);
          if (!saveState()) {
            state.files.shift();
            try { await deleteTaskAttachments([record.id]); }
            catch (error) { console.error("Could not delete file after record save failed.", error); }
            if (record.driveFileId) await postCloudAction({ action: "deleteFile", fileId: record.driveFileId }).catch(error => console.error("Could not remove Drive file after record save failed.", error));
            return;
          }
          selectedFileId = record.id;
          closeModal(); renderApp(); notify("File metadata registered.");
        }, "Register");
        $("#modal-form [name='file']").addEventListener("change", event => {
          const file = event.target.files[0];
          if (file) $("#modal-form [name='tag']").value = fileTypeFor(file);
        });
      }
      $("#employee-auth-form").addEventListener("submit", event => { event.preventDefault(); login(); });
      $("#logout").addEventListener("click", logout);
      $("#mobile-logout").addEventListener("click", logout);
      renderLogin();
      initializeCloud();
    })();
  </script>
</body>
</html>
